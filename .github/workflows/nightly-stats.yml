name: Nightly stats fetch

on:
  schedule:
    # TEMPORARY one-shot test of the 2026-10-01 cron-reliability fix: fires once,
    # 17:10 UTC (1:10pm EDT) on 2026-10-01 only (day-of-month 1, month 10), via the
    # month/day fields rather than a daily time, so it can't linger as a stray
    # daily trigger if reverting is forgotten. REVERT to the real schedule below
    # once this is confirmed to have fired.
    - cron: '10 17 1 10 *'
    # Real nightly schedule (restore this line, remove the one above, once verified):
    # - cron: '9 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-stats
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Fetch player and team game logs
        run: python3 scripts/fetch_stats.py --out-dir data/2026-2027

      - name: Commit playerdata.json / teamdata.json if either changed
        run: |
          git add data/2026-2027/playerdata.json data/2026-2027/teamdata.json
          if git diff --cached --quiet; then
            echo "No new games; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nightly stats update ($(date -u +%Y-%m-%d))"
          git push
